name: Deploy Supabase

# Memasang perubahan database & Edge Function ke Supabase secara otomatis
# setiap ada perubahan di folder supabase/ pada branch main.
# Bisa juga dijalankan manual: tab Actions → Deploy Supabase → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  test-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db

  deploy:
    needs: test-db
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Pasang migration database
        run: supabase db push --remote="$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --include-all --yes
      - name: Pasang Edge Functions
        run: supabase functions deploy --remote="$PROJECT_ID" --use-api --yes
